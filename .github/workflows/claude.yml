# Vibe coding: reaguje na @claude v issues a komentářích, vytváří PR s kódem.
# Soubor patří do: .github/workflows/claude.yml
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Flutter v runneru, aby Claude mohl sám spouštět `flutter analyze` a `flutter test`
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Varianta A (AKTIVNÍ): používá předplatné Claude Pro/Max přes OAuth token.
          # Token vznikne příkazem `claude setup-token` a uloží se jako secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Varianta B (vypnutá): API klíč z console.anthropic.com – platí se za spotřebu.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Claude vytváří PR vždy do větve dev (ne do main)
          base_branch: dev
