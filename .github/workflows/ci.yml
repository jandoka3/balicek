# CI: testy na každém PR; po mergi do main sestaví APK a vystaví ho ke stažení.
# Soubor patří do: .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    # APK se staví jen po mergi do main (ne na každém PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nejnovější build
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
